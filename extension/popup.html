<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 360px; font: 13px system-ui, sans-serif; margin: 12px; color: #222; }
    button { width: 100%; padding: 8px; font-weight: 600; cursor: pointer; }
    #status { margin: 8px 0; color: #555; }
    .setting { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: #555; }
    .setting select { font: 12px system-ui, sans-serif; }
    #load-note { color: #b26a00; margin: -4px 0 8px; }
    #load-note:empty { display: none; }
    .score { font-size: 28px; font-weight: 700; }
    .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #2e7d32; margin: 6px 0 10px; }
    .bar > div { background: #c62828; }
    .rating { color: #444; margin: 2px 0; }
    #summary { margin-bottom: 8px; }
    .review { border-top: 1px solid #ddd; padding: 6px 0; }
    .review.suspicious .tag { color: #c62828; }
    .review.genuine .tag { color: #2e7d32; }
    .review.skipped .tag { color: #757575; }
    .tag { font-weight: 600; }
    button.feedback { width: auto; padding: 1px 6px; margin-top: 4px; font: 11px system-ui, sans-serif; font-weight: 400; color: #555; background: none; border: 1px solid #ccc; border-radius: 4px; }
    button.feedback:disabled { cursor: default; color: #2e7d32; border-color: transparent; }
    .snippet { color: #444; margin: 2px 0; }
    .reasons { margin: 2px 0 0 16px; padding: 0; color: #666; }
    #list { max-height: 380px; overflow-y: auto; }
  </style>
</head>
<body>
  <button id="analyze">Analyze reviews on this page</button>
  <label class="setting">
    Reviews to check
    <select id="max-reviews">
      <option value="0">Only the ones on this page</option>
      <option value="50">Up to 50</option>
      <option value="100" selected>Up to 100 (Amazon's maximum)</option>
    </select>
  </label>
  <div id="status"></div>
  <div id="load-note"></div>
  <div id="summary"></div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
